# Dynamic scan of the running stack (B-31, SR-13) with OWASP ZAP baseline.
# Runs weekly, on manual dispatch and on pull requests labelled "dast".
# Brings the whole Docker Compose stack up with throwaway secrets generated per run.
name: DAST

on:
  schedule:
    - cron: '41 4 * * 2' # weekly, Tuesday 04:41 UTC
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

concurrency:
  group: dast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zap-baseline:
    name: ZAP baseline
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'dast')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      COMPOSE: docker compose --env-file .env -f infra/docker-compose.yml
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for the Compose stack
        id: stack
        run: |
          if [ -f infra/docker-compose.yml ]; then echo "exists=true"; else echo "exists=false"; fi >> "$GITHUB_OUTPUT"

      - name: Explain skip
        if: steps.stack.outputs.exists != 'true'
        run: echo "::notice title=No stack yet::infra/docker-compose.yml does not exist — run /bootstrap-project first."

      - name: Generate throwaway secrets
        if: steps.stack.outputs.exists == 'true'
        run: node scripts/dev-secrets.mjs

      - name: Start stack
        if: steps.stack.outputs.exists == 'true'
        run: $COMPOSE up -d --build --wait --wait-timeout 600

      - name: Scan web app
        if: steps.stack.outputs.exists == 'true'
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: https://localhost/
          rules_file_name: .zap/rules.tsv
          cmd_options: '-a'
          allow_issue_writing: false
          fail_action: true
          artifact_name: zap-baseline-web

      - name: Scan public API
        if: steps.stack.outputs.exists == 'true'
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: https://localhost/public/rates
          rules_file_name: .zap/rules.tsv
          cmd_options: '-a'
          allow_issue_writing: false
          fail_action: true
          artifact_name: zap-baseline-public-api

      - name: Service status on failure
        if: failure() && steps.stack.outputs.exists == 'true'
        run: $COMPOSE ps

      - name: Stop stack
        if: always() && steps.stack.outputs.exists == 'true'
        run: $COMPOSE down --volumes --remove-orphans
