# Build and test pipeline (B-05, SR-15).
# Calls only the root scripts defined in AGENTS.md › Commands (contract:
# .claude/skills/bootstrap-project/references/ci-contract.md).
# Required check for branch protection on main: "ci-success".
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: 'true'
  NODE_ENV: test
  # API configuration for tests (no secrets — the database is a throwaway service container)
  API_PORT: '3000'
  CORS_ORIGINS: http://localhost:8081
  OIDC_ISSUER_URL: https://localhost/auth/realms/sbank
  OIDC_AUDIENCE: sbank-api
  LOG_LEVEL: warn
  TRUST_PROXY: 'false'
  # App configuration — non-secret, embedded in bundles
  EXPO_PUBLIC_API_MODE: mock
  EXPO_PUBLIC_API_BASE_URL: https://localhost
  EXPO_PUBLIC_OIDC_ISSUER_URL: https://localhost/auth/realms/sbank
  EXPO_PUBLIC_OIDC_CLIENT_ID: sbank-app

jobs:
  detect:
    name: Detect project state
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      workspace: ${{ steps.state.outputs.workspace }}
      app: ${{ steps.state.outputs.app }}
      api: ${{ steps.state.outputs.api }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Inspect repository
        id: state
        run: |
          has() { if [ -e "$1" ]; then echo true; else echo false; fi; }
          {
            echo "workspace=$(has pnpm-lock.yaml)"
            echo "app=$(has app/package.json)"
            echo "api=$(has api/package.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Explain skipped jobs
        if: steps.state.outputs.workspace != 'true'
        run: echo "::notice title=Project not scaffolded::No pnpm workspace yet. Run /bootstrap-project in Claude Code; build and test jobs are skipped until then."

  quality:
    name: Format, lint, typecheck
    needs: detect
    if: needs.detect.outputs.workspace == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace

      - name: Formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

  unit-tests:
    name: Unit and component tests
    needs: detect
    if: needs.detect.outputs.workspace == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace

      - name: Tests
        run: pnpm run test

  api-e2e:
    name: API database and e2e tests
    needs: detect
    if: needs.detect.outputs.workspace == 'true' && needs.detect.outputs.api == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        # Major-version tag on purpose: the throwaway test database gets patch releases.
        # Keep the major in sync with infra/docker-compose.yml.
        image: postgres:18-alpine
        env:
          POSTGRES_USER: sbank
          POSTGRES_PASSWORD: ci-only-not-a-secret # gitleaks:allow
          POSTGRES_DB: sbank_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sbank -d sbank_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://sbank:ci-only-not-a-secret@localhost:5432/sbank_test # gitleaks:allow
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace

      - name: Validate Prisma schema
        run: pnpm run api:prisma:validate

      # The same script the Compose stack runs on first start, so the grants in the migration take effect
      # and the least-privilege tests (audit_log is INSERT-only for sbank_app, SR-14) run instead of skipping.
      # psql reads the passwords from its environment; the values are throwaway CI-only strings.
      - name: Create application roles
        env:
          PGPASSWORD: ci-only-not-a-secret # gitleaks:allow
          POSTGRES_DB: sbank_test
          POSTGRES_MIGRATOR_PASSWORD: ci-only-not-a-secret # gitleaks:allow
          POSTGRES_APP_PASSWORD: ci-only-not-a-secret # gitleaks:allow
        run: psql --host localhost --username sbank --dbname sbank_test --set ON_ERROR_STOP=1 --file infra/postgres/init/01-roles.sql

      - name: Apply migrations
        run: pnpm run api:db:migrate:deploy

      - name: Schema and migrations are in sync
        run: pnpm run api:db:check-drift

      - name: E2E and authorization tests
        run: pnpm run api:test:e2e

  contract:
    name: OpenAPI contract is up to date
    needs: detect
    if: needs.detect.outputs.workspace == 'true' && needs.detect.outputs.api == 'true' && needs.detect.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace

      - name: Regenerate OpenAPI document and app types
        run: |
          pnpm run api:openapi:generate
          pnpm run app:api:types

      - name: Generated contract must be committed
        run: |
          if ! git diff --exit-code -- api/openapi.json app/src/shared/api/schema.d.ts; then
            echo "::error title=Contract drift::Run 'pnpm run api:openapi:generate && pnpm run app:api:types' and commit the result."
            exit 1
          fi

  build:
    name: Build API and app bundles
    needs: detect
    if: needs.detect.outputs.workspace == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace

      - name: Build all workspaces (API + web export)
        run: pnpm run build

      - name: Compile native JS bundles (Android + iOS)
        if: needs.detect.outputs.app == 'true'
        run: pnpm run app:export:native

      - name: Expo doctor
        if: needs.detect.outputs.app == 'true'
        run: pnpm run app:doctor

  native-android:
    name: Native Android build (Gradle)
    # Slow — runs on main, on manual dispatch and on PRs labelled "native-build".
    needs: detect
    if: >-
      needs.detect.outputs.workspace == 'true' && needs.detect.outputs.app == 'true' &&
      (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'native-build'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          # JDK required by the React Native version in use; override with the ANDROID_JDK_VERSION variable.
          java-version: ${{ vars.ANDROID_JDK_VERSION || '17' }}
          cache: gradle

      - name: Prebuild and assemble debug APK
        run: pnpm run app:build:android

  ci-success:
    name: ci-success
    if: always()
    needs: [detect, quality, unit-tests, api-e2e, contract, build, native-android]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: All required jobs passed or were skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "::error::At least one CI job failed or was cancelled."
              exit 1
            fi
          done
