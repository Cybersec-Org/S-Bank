# Security pipeline (B-17, B-32, SR-10, SR-15, T-07, T-08).
# Blocking: secrets (gitleaks), SAST (Semgrep, ERROR severity), dependency audit
# (high+), Trivy filesystem and image scans (HIGH/CRITICAL with a fix), workflow
# security (actionlint, zizmor). CodeQL and dependency review run when the
# repository variable ENABLE_CODE_SCANNING is "true" (public repository or
# GitHub Code Security enabled). Required check on main: "security-gate".
name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * 1' # weekly, Monday 05:17 UTC — catches newly published advisories
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TRIVY_VERSION: v0.75.0
  SEMGREP_IMAGE: semgrep/semgrep:1.180.0
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1
  ACTIONLINT_IMAGE: rhysd/actionlint:1.7.12
  ZIZMOR_VERSION: 1.30.1

jobs:
  detect:
    name: Detect project state
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      workspace: ${{ steps.state.outputs.workspace }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Inspect repository
        id: state
        run: |
          if [ -f pnpm-lock.yaml ]; then echo "workspace=true"; else echo "workspace=false"; fi >> "$GITHUB_OUTPUT"

  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Check out (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run gitleaks
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$GITHUB_WORKSPACE:/repo" -w /repo "$GITLEAKS_IMAGE" \
            git /repo --config /repo/.gitleaks.toml --redact --no-banner --exit-code 1 \
            --report-format sarif --report-path /repo/gitleaks.sarif

      - name: Upload report
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          retention-days: 14

  sast-semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan (project rules + registry rulesets)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src "$SEMGREP_IMAGE" \
            semgrep scan --metrics off --disable-version-check \
              --config .semgrep/ \
              --config p/typescript --config p/javascript --config p/nodejs --config p/react \
              --config p/owasp-top-ten --config p/jwt --config p/secrets \
              --config p/dockerfile --config p/github-actions \
              --sarif-output=semgrep.sarif --json-output=semgrep.json

      - name: Upload SARIF to code scanning
        if: always() && vars.ENABLE_CODE_SCANNING == 'true' && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Upload report
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semgrep-report
          path: |
            semgrep.sarif
            semgrep.json
          retention-days: 14

      - name: Fail on ERROR-severity findings
        run: |
          count=$(jq '[.results[] | select(.extra.severity == "ERROR")] | length' semgrep.json)
          jq -r '.results[] | select(.extra.severity == "ERROR") | "::error file=\(.path),line=\(.start.line),title=\(.check_id)::\(.extra.message | gsub("\n"; " "))"' semgrep.json
          echo "Semgrep ERROR findings: $count"
          test "$count" -eq 0

  codeql:
    name: SAST (CodeQL, ${{ matrix.language }})
    if: vars.ENABLE_CODE_SCANNING == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: codeql-${{ matrix.language }}

  dependency-audit:
    name: Dependency audit (pnpm audit)
    needs: detect
    if: needs.detect.outputs.workspace == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain
        uses: ./.github/actions/setup-workspace
        with:
          install: 'false'

      - name: Audit lockfile (high and critical fail)
        run: pnpm audit --audit-level high

  dependency-review:
    name: Dependency review (PR)
    if: github.event_name == 'pull_request' && vars.ENABLE_CODE_SCANNING == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

  trivy-fs:
    name: Trivy (dependencies, IaC, secrets)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned to a commit SHA: in March 2026 the trivy-action tags were force-pushed to malicious commits.
      - name: Scan repository
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore
          skip-dirs: node_modules,app/dist,app/dist-native,api/dist

  container-images:
    name: Trivy image scan (${{ matrix.component }})
    needs: detect
    if: needs.detect.outputs.workspace == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        component: [api, app]
    env:
      COMPONENT: ${{ matrix.component }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for Dockerfile
        id: dockerfile
        run: |
          if [ -f "$COMPONENT/Dockerfile" ]; then echo "exists=true"; else echo "exists=false"; fi >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        if: steps.dockerfile.outputs.exists == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (not pushed)
        if: steps.dockerfile.outputs.exists == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.component }}/Dockerfile
          load: true
          push: false
          tags: sbank-${{ matrix.component }}:ci

      - name: Scan image
        if: steps.dockerfile.outputs.exists == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: image
          image-ref: sbank-${{ matrix.component }}:ci
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore

  workflows:
    name: Workflow security (actionlint, zizmor)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint
        run: docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /repo "$ACTIONLINT_IMAGE" -color

      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: pipx run "zizmor==$ZIZMOR_VERSION" --min-severity medium --format github .github/

  security-gate:
    name: security-gate
    if: always()
    needs:
      [
        detect,
        secrets,
        sast-semgrep,
        codeql,
        dependency-audit,
        dependency-review,
        trivy-fs,
        container-images,
        workflows,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: All security jobs passed or were skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "::error::At least one security job failed or was cancelled."
              exit 1
            fi
          done
