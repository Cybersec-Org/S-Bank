name: Setup workspace
description: Installs pnpm (version from package.json "packageManager"), Node.js (version from .nvmrc) and the workspace dependencies from the lockfile.

inputs:
  install:
    description: Run `pnpm install --frozen-lockfile` after the toolchain is ready.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Set up pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
