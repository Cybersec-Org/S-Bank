# Project-specific Semgrep rules: the security invariants from AGENTS.md as code.
# ERROR findings fail the Security workflow. Suppress only with
# `// nosemgrep: <rule-id> -- <reason>` on the line, reviewed in the PR.
rules:
  - id: sbank-prisma-raw-unsafe
    message: >-
      $queryRawUnsafe / $executeRawUnsafe build SQL from strings (SQL injection, SR-06).
      Use the tagged template $queryRaw`... ${value}` or Prisma.sql.
    severity: ERROR
    languages: [typescript, javascript]
    metadata: { category: security, requirement: SR-06, owasp: 'API8:2023' }
    pattern-either:
      - pattern: $DB.$queryRawUnsafe(...)
      - pattern: $DB.$executeRawUnsafe(...)

  - id: sbank-prisma-raw-dynamic
    message: >-
      Prisma.raw() with a non-literal argument inserts unescaped SQL (SR-06).
      Pass values as template parameters instead.
    severity: ERROR
    languages: [typescript, javascript]
    metadata: { category: security, requirement: SR-06 }
    patterns:
      - pattern: Prisma.raw($X)
      - pattern-not: Prisma.raw("...")

  - id: sbank-browser-storage
    message: >-
      localStorage/sessionStorage are readable by any script on the page (XSS → token theft, T-03).
      Tokens and financial data stay in memory on web (SR-09).
    severity: ERROR
    languages: [typescript, javascript]
    metadata: { category: security, requirement: SR-09, masvs: MASVS-STORAGE }
    paths:
      include: ['/app/']
    pattern-either:
      - pattern: localStorage.$METHOD(...)
      - pattern: sessionStorage.$METHOD(...)
      - pattern: window.localStorage.$METHOD(...)
      - pattern: window.sessionStorage.$METHOD(...)

  - id: sbank-sensitive-async-storage
    message: >-
      AsyncStorage is unencrypted. Tokens and secrets belong in expo-secure-store via
      src/shared/auth/secure-storage.ts (SR-09).
    severity: ERROR
    languages: [typescript, javascript]
    metadata: { category: security, requirement: SR-09, masvs: MASVS-STORAGE }
    patterns:
      - pattern: AsyncStorage.setItem($KEY, ...)
      - metavariable-regex:
          metavariable: $KEY
          regex: (?i).*(token|secret|password|session|credential|iban|balance).*

  - id: sbank-jwt-verify-without-algorithms
    message: >-
      jose jwtVerify must pin the accepted algorithms (alg confusion, SR-04):
      jwtVerify(token, jwks, { algorithms: [...], issuer, audience }).
    severity: ERROR
    languages: [typescript, javascript]
    metadata: { category: security, requirement: SR-04 }
    pattern-either:
      - pattern: jwtVerify($TOKEN, $KEY)
      - patterns:
          - pattern: jwtVerify($TOKEN, $KEY, {...})
          - pattern-not: 'jwtVerify($TOKEN, $KEY, {..., algorithms: $ALGS, ...})'

  - id: sbank-jwt-decode-without-verify
    message: >-
      decodeJwt() does not verify the signature. In the API use the verified payload from
      the TokenVerifier (SR-04).
    severity: WARNING
    languages: [typescript, javascript]
    metadata: { category: security, requirement: SR-04 }
    paths:
      include: ['/api/src/']
    pattern: decodeJwt(...)

  - id: sbank-validation-pipe-whitelist
    message: 'ValidationPipe must use whitelist: true (mass assignment, SR-06, API3).'
    severity: ERROR
    languages: [typescript]
    metadata: { category: security, requirement: SR-06, owasp: 'API3:2023' }
    patterns:
      - pattern: new ValidationPipe(...)
      - pattern-not: 'new ValidationPipe({..., whitelist: true, ...})'

  - id: sbank-validation-pipe-forbid-non-whitelisted
    message: 'ValidationPipe must use forbidNonWhitelisted: true so unknown fields are rejected, not silently dropped (SR-06).'
    severity: ERROR
    languages: [typescript]
    metadata: { category: security, requirement: SR-06, owasp: 'API3:2023' }
    patterns:
      - pattern: new ValidationPipe(...)
      - pattern-not: 'new ValidationPipe({..., forbidNonWhitelisted: true, ...})'

  - id: sbank-cors-allow-all
    message: CORS must use the allowlist from CORS_ORIGINS, never all origins (SR-13).
    severity: ERROR
    languages: [typescript, javascript]
    metadata: { category: security, requirement: SR-13 }
    pattern-either:
      - pattern: $APP.enableCors()
      - pattern: '$APP.enableCors({..., origin: "*", ...})'
      - pattern: '$APP.enableCors({..., origin: true, ...})'

  - id: sbank-tls-verification-disabled
    message: Disabling TLS certificate verification enables MITM (SR-08). Configure the CA instead.
    severity: ERROR
    languages: [typescript, javascript]
    metadata: { category: security, requirement: SR-08, masvs: MASVS-NETWORK }
    pattern-either:
      - pattern: '{..., rejectUnauthorized: false, ...}'
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = $VALUE

  - id: sbank-insecure-random-in-api
    message: Math.random() is predictable. Use randomUUID()/randomBytes() from node:crypto (SR-10).
    severity: ERROR
    languages: [typescript, javascript]
    metadata: { category: security, requirement: SR-10, masvs: MASVS-CRYPTO }
    paths:
      include: ['/api/src/']
    pattern: Math.random()

  - id: sbank-webview-javascript-enabled
    message: WebView content must run without JavaScript (SR-12). Set javaScriptEnabled={false}.
    severity: ERROR
    languages: [typescript, javascript]
    metadata: { category: security, requirement: SR-12, masvs: MASVS-PLATFORM }
    pattern: <WebView javaScriptEnabled={true} />

  - id: sbank-webview-any-origin
    message: WebView must allow only listed HTTPS origins, not "*" (SR-12).
    severity: ERROR
    languages: [typescript, javascript]
    metadata: { category: security, requirement: SR-12, masvs: MASVS-PLATFORM }
    pattern: <WebView originWhitelist={["*"]} />

  - id: sbank-webview-bridge
    message: No JS ↔ native bridge in WebView (SR-12). Remove onMessage / injectedJavaScript.
    severity: ERROR
    languages: [typescript, javascript]
    metadata: { category: security, requirement: SR-12, masvs: MASVS-PLATFORM }
    pattern-either:
      - pattern: <WebView onMessage={$HANDLER} />
      - pattern: <WebView injectedJavaScript={$CODE} />
      - pattern: <WebView injectedJavaScriptBeforeContentLoaded={$CODE} />

  - id: sbank-console-in-api
    message: Use the pino logger (with redaction) instead of console.* in the API (SR-14, no secrets in logs).
    severity: WARNING
    languages: [typescript, javascript]
    metadata: { category: maintainability, requirement: SR-14 }
    paths:
      include: ['/api/src/']
    pattern: console.$METHOD(...)
