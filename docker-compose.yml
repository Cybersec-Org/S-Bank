services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-sbank}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: start-dev --import-realm
    restart: unless-stopped
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?Set KEYCLOAK_ADMIN_USERNAME in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      # Fixed public issuer (D15, P-04): browser, emulator (adb reverse) and API all see
      # iss = http://localhost:8080/realms/sbank. Back-channel calls from containers (http://keycloak:8080)
      # keep working thanks to the dynamic back-channel hostname.
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9000:9000"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./infra/keycloak:/opt/keycloak/data/import:ro
      # S-Bank login theme (P-16); start-dev disables the theme cache, so edits show after a page reload.
      - ./infra/keycloak/themes/sbank:/opt/keycloak/themes/sbank:ro

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sbank}
      # OIDC (P-04): tokens carry the public issuer; keys are fetched inside the Compose network (A12).
      AUTH_MODE: oidc
      OIDC_ISSUER_URL: http://localhost:8080/realms/sbank
      OIDC_JWKS_URL: http://keycloak:8080/realms/sbank/protocol/openid-connect/certs
      OIDC_AUDIENCE: sbank-api
      OIDC_CLIENT_ID: sbank-app
      # Passkey list/delete (/auth/passkeys) still uses the master admin account - open item A5.
      KEYCLOAK_ADMIN_URL: http://keycloak:8080
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      PARTNER_PROXY_TOKEN: ${PARTNER_PROXY_TOKEN:?Set PARTNER_PROXY_TOKEN in .env}
      PARTNER1_CERT_SHA256: ${PARTNER1_CERT_SHA256:?Set PARTNER1_CERT_SHA256 in .env}
      PARTNER2_CERT_SHA256: ${PARTNER2_CERT_SHA256:?Set PARTNER2_CERT_SHA256 in .env}
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      PARTNER_PROXY_TOKEN: ${PARTNER_PROXY_TOKEN:?Set PARTNER_PROXY_TOKEN in .env}
    ports:
      - "8443:8443"
    volumes:
      - ./Caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs/ca/ca.crt:/etc/caddy/certs/ca.crt:ro
      - ./certs/server/server.crt:/etc/caddy/certs/server.crt:ro
      - ./certs/server/server.key:/etc/caddy/certs/server.key:ro

volumes:
  postgres_data:
  keycloak_data:
